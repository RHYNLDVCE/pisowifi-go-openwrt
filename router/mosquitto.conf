# /etc/mosquitto/mosquitto.conf
# Mosquitto MQTT broker config for the PisoWifi router.
# Place this file at /etc/mosquitto/mosquitto.conf on the OpenWrt router.

# Listen only on LAN (do not expose to WAN)
listener 1883 10.0.0.1
protocol mqtt

# Disable anonymous access — require username/password
allow_anonymous false
password_file /etc/mosquitto/passwd

# Persistence (optional but helps with QoS 1 message delivery)
persistence true
persistence_location /tmp/mosquitto/

# Logging
log_dest syslog
log_type error
log_type warning
log_type notice
log_type information
