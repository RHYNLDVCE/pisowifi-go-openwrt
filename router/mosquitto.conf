# /etc/mosquitto/mosquitto.conf
# Mosquitto MQTT broker config for the PisoWifi router.
# Place this file at /etc/mosquitto/mosquitto.conf on the OpenWrt router.

# Listen only on LAN interface
listener 1883 10.0.0.1
protocol mqtt

# Allow anonymous connections — access is restricted at the firewall level.
# Only 10.0.0.2 (Orange Pi) is allowed to reach port 1883 via nftables rule.
allow_anonymous true

# Persistence (optional but helps with QoS 1 message delivery)
persistence true
persistence_location /tmp/mosquitto/

# Logging
log_dest syslog
log_type error
log_type warning
log_type notice
